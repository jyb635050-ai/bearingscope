<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Precision bearing cross-section</title>
  <desc id="desc">A polished tapered roller bearing rendered in steel and brass tones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0b151c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0b151c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#050c11" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#f3f7f8"/>
      <stop offset=".13" stop-color="#8f9ba2"/>
      <stop offset=".27" stop-color="#2d3b44"/>
      <stop offset=".48" stop-color="#d8e0e3"/>
      <stop offset=".62" stop-color="#52616a"/>
      <stop offset=".82" stop-color="#f5f7f8"/>
      <stop offset="1" stop-color="#26323a"/>
    </linearGradient>
    <linearGradient id="steel-dark" x1="0" x2="1">
      <stop offset="0" stop-color="#0b1217"/>
      <stop offset=".45" stop-color="#5b6870"/>
      <stop offset=".53" stop-color="#c5ced2"/>
      <stop offset=".62" stop-color="#202b32"/>
      <stop offset="1" stop-color="#070d11"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#6f3513"/>
      <stop offset=".3" stop-color="#d58b38"/>
      <stop offset=".52" stop-color="#ffd18a"/>
      <stop offset=".72" stop-color="#aa5d20"/>
      <stop offset="1" stop-color="#54250d"/>
    </linearGradient>
    <radialGradient id="hub">
      <stop offset="0" stop-color="#111d24"/>
      <stop offset=".7" stop-color="#050a0e"/>
      <stop offset="1" stop-color="#29343a"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-8" dy="18" stdDeviation="12" flood-color="#000" flood-opacity=".62"/>
    </filter>
    <g id="roller">
      <ellipse cx="0" cy="-136" rx="24" ry="38" fill="url(#steel)" stroke="#17232a" stroke-width="5"/>
      <ellipse cx="-6" cy="-144" rx="5" ry="21" fill="#fff" opacity=".34"/>
    </g>
    <g id="cage-window">
      <path d="M-26-154 C-10-166 10-166 26-154 L20-118 C8-108-8-108-20-118Z" fill="none" stroke="url(#brass)" stroke-width="12" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <g transform="translate(758 148) rotate(-15) scale(1 .48)" filter="url(#shadow)">
    <circle r="211" fill="none" stroke="url(#steel-dark)" stroke-width="49"/>
    <circle r="181" fill="none" stroke="url(#steel)" stroke-width="11" opacity=".82"/>
    <g opacity=".95">
      <use href="#cage-window" transform="rotate(0)"/><use href="#cage-window" transform="rotate(30)"/>
      <use href="#cage-window" transform="rotate(60)"/><use href="#cage-window" transform="rotate(90)"/>
      <use href="#cage-window" transform="rotate(120)"/><use href="#cage-window" transform="rotate(150)"/>
      <use href="#cage-window" transform="rotate(180)"/><use href="#cage-window" transform="rotate(210)"/>
      <use href="#cage-window" transform="rotate(240)"/><use href="#cage-window" transform="rotate(270)"/>
      <use href="#cage-window" transform="rotate(300)"/><use href="#cage-window" transform="rotate(330)"/>
    </g>
    <g>
      <use href="#roller" transform="rotate(0)"/><use href="#roller" transform="rotate(30)"/>
      <use href="#roller" transform="rotate(60)"/><use href="#roller" transform="rotate(90)"/>
      <use href="#roller" transform="rotate(120)"/><use href="#roller" transform="rotate(150)"/>
      <use href="#roller" transform="rotate(180)"/><use href="#roller" transform="rotate(210)"/>
      <use href="#roller" transform="rotate(240)"/><use href="#roller" transform="rotate(270)"/>
      <use href="#roller" transform="rotate(300)"/><use href="#roller" transform="rotate(330)"/>
    </g>
    <circle r="94" fill="url(#hub)" stroke="url(#steel)" stroke-width="27"/>
    <circle r="66" fill="#020609" stroke="#8b989f" stroke-width="4" opacity=".92"/>
    <ellipse cx="-48" cy="-98" rx="58" ry="8" fill="#fff" opacity=".16" transform="rotate(-28)"/>
  </g>
</svg>
